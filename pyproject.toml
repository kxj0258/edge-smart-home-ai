[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-smart-home-ai"
version = "0.1.0"
description = "Edge AI smart-home control proof of concept"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
voice = [
  "numpy",
  "sherpa-onnx==1.13.6",
  "sounddevice",
]

[project.scripts]
edge-smart-home = "edge_smart_home.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
